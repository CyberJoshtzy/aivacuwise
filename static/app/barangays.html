<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barangays · BilisLikas 2.0</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="app.css?v=8">
</head>
<body>
<div class="shell">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1 id="title">Barangays</h1>
        <p id="sub">Barangays registered in BilisLikas 2.0.</p>
      </div>
      <div class="toolbar">
        <div class="search" id="searchBox" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><label for="q" class="sr-only">Search barangays</label><input id="q" class="input" type="search" placeholder="Search barangay"></div>
        <button type="button" class="btn btn-primary" id="add" hidden>Add Barangay</button>
      </div>
    </div>
    <div id="loadError" class="form-error" role="alert" hidden></div>

    <section class="panel" style="padding:0;overflow:hidden">
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th scope="col">Barangay</th><th scope="col">District</th><th scope="col">Residents</th><th scope="col">Evacuated now</th><th scope="col">Centers</th><th scope="col">Evacuation</th><th scope="col" style="text-align:right">Actions</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" style="margin:16px" hidden></div>
    </section>
    <p class="notice" id="note"></p>
  </main>
</div>
<script src="app.js?v=8"></script>
<script>
(async () => {
  const me = await BL.requireAuth();
  const city = me.role === 'city_admin';
  const $ = (id) => document.getElementById(id);
  let rows = [];
  let districts = [];
  try { districts = await BL.api('/districts') || []; } catch (e) { districts = []; }

  async function load() {
    try {
      const [brgys, evacuees, centers, summary, act] = await Promise.all([
        BL.api('/barangays'), BL.api('/evacuees'), BL.api('/evacuation_centers'), BL.api('/dashboard/summary'),
        BL.api('/incidents?active=true').catch(() => [])
      ]);
      const present = new Set();
      (summary.barangays || []).forEach((b) => (b.centers || []).forEach((c) => (c.evacuees || []).forEach((p) => present.add(p.id))));
      rows = (brgys || []).filter((b) => city || b.id === me.barangay_id).map((b) => {
        const res = (evacuees || []).filter((e) => e.registered_barangay_id === b.id);
        return {
          id: b.id, name: b.name, district: b.district || '', residents: res.length,
          evac: res.filter((e) => present.has(e.id)).length,
          centers: (centers || []).filter((c) => c.barangay_id === b.id).length,
          incident: (act || []).find((i) => i.barangay_id === b.id)
        };
      });
      if (!city && rows[0]) BL.renderSidebar(me, 'barangays.html', rows[0].name);
      $('loadError').hidden = true;
      render();
    } catch (e) { $('loadError').textContent = e.message; $('loadError').hidden = false; }
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const shown = rows.filter((r) => !q || (r.name + ' ' + r.district).toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
    $('rows').innerHTML = shown.map((r) =>
      '<tr><td><strong style="color:var(--navy);font-size:15px">' + BL.esc(r.name) + '</strong></td>' +
      '<td>' + (r.district ? BL.esc(r.district) : '<span style="color:var(--muted)">Not set</span>') + '</td>' +
      '<td>' + r.residents + '</td>' +
      '<td>' + r.evac + (r.residents ? ' <span style="color:var(--muted)">(' + Math.round(r.evac / r.residents * 100) + '%)</span>' : '') + '</td>' +
      '<td>' + r.centers + '</td>' +
      '<td>' + (r.incident ? '<span class="chip red">Active: ' + BL.esc(r.incident.disaster_type) + '</span>' : '<span style="color:var(--muted)">None</span>') + '</td>' +
      '<td><div class="row-actions">' +
      '<button type="button" class="btn btn-ghost btn-sm" data-act="edit" data-id="' + r.id + '" aria-label="Edit ' + BL.esc(r.name) + '">Edit</button>' +
      (city ? '<button type="button" class="btn btn-del btn-sm" data-act="del" data-id="' + r.id + '" aria-label="Delete ' + BL.esc(r.name) + '">Delete</button>' : '') +
      '</div></td></tr>').join('');
    $('empty').hidden = shown.length > 0;
    $('empty').textContent = rows.length ? 'No barangays match your search.' : 'No barangays yet.';
  }

  const xBtn = '<button type="button" class="x-btn" data-close aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A5368" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>';

  function form(r) {
    const editing = !!r;
    const m = BL.modal(
      '<form id="bf" novalidate style="display:contents"><div class="dialog-head"><h2>' + (editing ? 'Edit barangay' : 'Add barangay') + '</h2>' + xBtn + '</div>' +
      '<div class="dialog-body"><div class="form-error" id="bErr" hidden style="margin-bottom:14px"></div>' +
      '<div class="field-group"><label for="bName">Barangay name *</label><input id="bName" class="input" placeholder="e.g., Barangay 200, Zone 18" value="' + BL.esc(editing ? r.name : '') + '"></div>' +
      (city ? '<div class="field-group" style="margin-top:14px"><label for="bDist">District (City of Manila)</label><select id="bDist" class="input"><option value="">Not set</option>' +
        districts.map((d) => '<option' + (editing && r.district === d ? ' selected' : '') + '>' + BL.esc(d) + '</option>').join('') + '</select></div>' : '') +
      '</div>' +
      '<div class="dialog-foot"><span></span><div style="display:flex;gap:10px"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="submit" class="btn btn-primary" id="bSave">' + (editing ? 'Save Changes' : 'Add Barangay') + '</button></div></div></form>', 540);
    const f = (id) => m.el.querySelector('#' + id);
    const sync = () => { f('bSave').disabled = !f('bName').value.trim(); };
    f('bName').addEventListener('input', sync); sync();
    f('bf').addEventListener('submit', async (e) => {
      e.preventDefault();
      f('bSave').disabled = true;
      const name = f('bName').value.trim();
      try {
        let id = editing ? r.id : null;
        if (editing) await BL.api('/barangays/' + r.id, { method: 'PUT', json: { name } });
        else id = (await BL.api('/barangays', { method: 'POST', json: { name } })).id;
        if (city && f('bDist') && id && f('bDist').value !== (editing ? r.district : '')) {
          await BL.api('/barangays/' + id + '/district', { method: 'PUT', json: { district: f('bDist').value || null } });
        }
        m.close();
        BL.toast(editing ? 'Barangay name updated.' : name + ' was added.');
        load();
      } catch (ex) { f('bErr').textContent = ex.message; f('bErr').hidden = false; f('bSave').disabled = false; }
    });
  }

  $('rows').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const r = rows.find((x) => x.id === Number(b.dataset.id)); if (!r) return;
    if (b.dataset.act === 'edit') form(r);
    if (b.dataset.act === 'del') {
      BL.confirmBox({
        title: 'Delete ' + r.name + '?',
        text: 'Only a barangay with no centers, residents, accounts, households, or evacuation records can be deleted. Anything still linked must be removed or moved first.',
        ok: 'Delete Barangay', danger: true,
        action: () => BL.api('/barangays/' + r.id, { method: 'DELETE' })
      }).then((done) => { if (done) { BL.toast(r.name + ' was deleted.'); load(); } });
    }
  });

  if (city) {
    BL.renderSidebar(me, 'barangays.html');
    $('add').hidden = false;
    $('searchBox').hidden = false;
    $('add').addEventListener('click', () => form(null));
    $('q').addEventListener('input', render);
    $('note').textContent = 'Only the City Admin can add or delete barangays. Barangay officials can rename their own barangay. The registering official, designation, and contact details from the design arrive with barangay self-registration.';
  } else {
    BL.renderSidebar(me, 'barangays.html');
    $('title').textContent = 'Your Barangay';
    $('sub').textContent = 'Your barangay\'s record in BilisLikas 2.0.';
    $('note').textContent = 'You can rename your barangay. Adding or deleting barangays is done by the City Admin.';
  }
  await load();
})();
</script>
</body>
</html>
