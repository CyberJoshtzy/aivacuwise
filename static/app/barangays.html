<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barangays · Ai-Vacuwise</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="app.css?v=56">
<style>
.head-tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.head-tools .search { width: 300px; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: #F6F8FD; }
.cnames { display: flex; flex-wrap: wrap; gap: 6px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 22px; }
.facts .k { font-size: 15px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.facts .v { font-size: 15px; font-weight: 600; color: #1F2937; margin-top: 2px; }
.facts .full { grid-column: 1 / -1; }
.off { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg); margin-bottom: 6px; font-size: 15px; }
@media (max-width: 700px) { .facts { grid-template-columns: 1fr; } .head-tools .search { width: 100%; } }
</style>
  <link rel="icon" type="image/png" href="/static/favicon.png?v=2">
</head>
<body>
<div class="shell">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Barangays</h1>
        <p id="count">Loading barangays.</p>
      </div>
      <div class="head-tools">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" class="input" type="search" placeholder="Search barangay" aria-label="Search barangay">
        </div>
        <button type="button" class="btn btn-primary" id="add" hidden>Add Barangay</button>
      </div>
    </div>
    <div id="loadError" class="form-error" role="alert" hidden></div>
    <section class="panel" style="padding:0;overflow:hidden">
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th scope="col">Barangay</th><th scope="col">District</th><th scope="col">Zone</th><th scope="col">Residents</th><th scope="col">Evacuation centers</th><th scope="col" style="text-align:right">Actions</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" style="margin:16px" hidden></div>
    </section>
  </main>
</div>
<script src="app.js?v=55"></script>
<script>
(async () => {
  const me = await BL.requireAuth();
  const city = me.role === 'city_admin';
  const $ = (id) => document.getElementById(id);
  let list = [], districts = [];
  try { districts = await BL.api('/districts') || []; } catch (e) { /* optional */ }
  const xBtn = '<button type="button" class="x-btn" data-close aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A5368" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>';
  $('add').hidden = !city;

  async function load() {
    try {
      list = await BL.api('/barangay_info') || [];
      $('loadError').hidden = true;
      const mine = list.find((b) => b.id === me.barangay_id);
      if (!document.getElementById('signout')) BL.renderSidebar(me, 'barangays.html', mine ? mine.name : null);
      if (me.role !== 'city_admin') { document.querySelector('.page-head h1').textContent = 'Barangay Profile'; document.title = 'Barangay Profile · Ai-Vacuwise'; }
      render();
    } catch (e) { if (!document.getElementById('signout')) BL.renderSidebar(me, 'barangays.html'); $('loadError').textContent = e.message; $('loadError').hidden = false; }
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const shown = list.filter((b) => !q || b.name.toLowerCase().includes(q))
      .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    const total = list.reduce((s, b) => s + b.residents, 0);
    $('count').textContent = list.length + (list.length === 1 ? ' barangay' : ' barangays') + ' registered in Ai-Vacuwise, with ' + total + ' residents in total.';
    $('rows').innerHTML = shown.map((b) =>
      '<tr class="clickable" data-id="' + b.id + '" tabindex="0">' +
      '<td><strong style="color:var(--navy);font-size:15px">' + BL.esc(b.name) + '</strong>' + (b.address ? '<div style="font-size:15px;color:var(--muted)">' + BL.esc(b.address) + '</div>' : '') + '</td>' +
      '<td>' + (b.district ? BL.esc(b.district) : '<span style="color:var(--muted)">Not set</span>') + '</td>' +
      '<td>' + (b.zone ? BL.esc(b.zone) : '<span style="color:var(--muted)">Not set</span>') + '</td>' +
      '<td><strong>' + b.residents + '</strong></td>' +
      '<td><div class="cnames">' + (b.centers.length ? b.centers.map((c) => '<span class="chip navy">' + BL.esc(c) + '</span>').join('') : '<span style="color:var(--muted)">None yet</span>') + '</div></td>' +
      '<td><div class="row-actions">' +
      '<button type="button" class="btn btn-ghost btn-sm" data-act="edit" data-id="' + b.id + '">Edit</button>' +
      (city ? '<button type="button" class="btn btn-del btn-sm" data-act="del" data-id="' + b.id + '">Delete</button>' : '') +
      '</div></td></tr>').join('');
    $('empty').hidden = shown.length > 0;
    $('empty').textContent = list.length ? 'No barangay matches your search.' : 'No barangays registered yet.';
  }

  $('q').addEventListener('input', render);
  $('rows').addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    const b = list.find((x) => x.id === Number(tr.dataset.id)); if (!b) return;
    const btn = e.target.closest('button[data-act]');
    const act = btn ? btn.dataset.act : 'view';
    if (act === 'view') view(b); else if (act === 'edit') edit(b); else if (act === 'del') del(b);
  });
  $('rows').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const tr = e.target.closest('tr[data-id]'); if (tr) view(list.find((x) => x.id === Number(tr.dataset.id)));
  });

  function view(b) {
    const ch = b.chairman;
    const m = BL.modal(
      '<div class="dialog-head"><div><h2>' + BL.esc(b.name) + '</h2><div style="font-size:15px;color:var(--muted)">' + (b.zone ? BL.esc(b.zone) + ', ' : '') + (b.district ? 'District of ' + BL.esc(b.district) : 'District not set') + '</div></div>' + xBtn + '</div>' +
      '<div class="dialog-body" style="display:flex;flex-direction:column;gap:18px">' +
      '<div class="facts">' +
      '<div class="full"><div class="k">Barangay address</div><div class="v">' + BL.esc(b.address || 'Not set yet') + '</div></div>' +
      '<div><div class="k">' + BL.esc(ch && ch.designation ? ch.designation : 'Barangay chairman') + '</div><div class="v">' + BL.esc(ch ? ch.name || '-' : 'No official account yet') + '</div></div>' +
      '<div><div class="k">Active mobile number</div><div class="v">' + (ch && ch.mobile ? '<a href="tel:' + BL.esc(ch.mobile) + '">' + BL.esc(ch.mobile) + '</a>' : '-') + '</div></div>' +
      '<div><div class="k">Total residents</div><div class="v">' + b.residents + '</div></div>' +
      '<div><div class="k">Evacuation centers</div><div class="v">' + (b.centers.length ? b.centers.map(BL.esc).join(', ') : 'None yet') + '</div></div>' +
      '</div>' +
      (b.officials.length > 1 ? '<div><h3 style="font-size:16px;font-weight:800;margin-bottom:8px">Other registered officials</h3>' +
        b.officials.slice(1).map((o) => '<div class="off"><span><strong style="color:var(--navy)">' + BL.esc(o.name || '-') + '</strong> &middot; ' + BL.esc(o.designation || '-') + '</span><span>' + BL.esc(o.mobile || '-') + '</span></div>').join('') + '</div>' : '') +
      '</div>' +
      '<div class="dialog-foot"><span></span><div style="display:flex;gap:10px">' +
      (city ? '<button type="button" class="btn btn-del" id="vDel">Delete</button>' : '') +
      '<button type="button" class="btn btn-primary" id="vEdit">Edit</button></div></div>', 720);
    m.el.querySelector('#vEdit').addEventListener('click', () => { m.close(); edit(b); });
    const d = m.el.querySelector('#vDel'); if (d) d.addEventListener('click', () => { m.close(); del(b); });
  }

  function edit(b) {
    const m = BL.modal(
      '<div class="dialog-head"><h2>Edit ' + BL.esc(b.name) + '</h2>' + xBtn + '</div>' +
      '<div class="dialog-body" style="display:flex;flex-direction:column;gap:16px">' +
      '<div id="eErr" class="form-error" hidden></div>' +
      '<div class="field-group"><label for="eName">Barangay name</label><input id="eName" class="input" value="' + BL.esc(b.name) + '"></div>' +
      '<div class="field-group"><label for="eAddr">Barangay address (barangay hall)</label><input id="eAddr" class="input" placeholder="e.g. 123 Hermosa St., Tondo, Manila" value="' + BL.esc(b.address || '') + '"></div>' +
      (districts.length ? '<div class="field-group"><label for="eDist">District (City of Manila)</label><select id="eDist" class="input"><option value="">Not set</option>' + districts.map((x) => '<option' + (x === b.district ? ' selected' : '') + '>' + BL.esc(x) + '</option>').join('') + '</select></div>' : '') +
      '<div class="field-group"><label for="eZone">Zone</label><input id="eZone" class="input" inputmode="numeric" placeholder="e.g., 17" value="' + BL.esc((b.zone || '').replace(/^Zone /, '')) + '"></div>' +
      '</div>' +
      '<div class="dialog-foot"><span></span><div style="display:flex;gap:10px"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="button" class="btn btn-primary" id="eSave">Save</button></div></div>', 620);
    m.el.querySelector('#eSave').addEventListener('click', async () => {
      const btn = m.el.querySelector('#eSave'); btn.disabled = true;
      try {
        const dist = m.el.querySelector('#eDist');
        await BL.api('/barangays/' + b.id + '/info', { method: 'PUT', json: { name: m.el.querySelector('#eName').value, address: m.el.querySelector('#eAddr').value, district: dist ? dist.value : b.district, zone: m.el.querySelector('#eZone').value } });
        m.close(); BL.toast('Barangay saved.'); load();
      } catch (e) { const x = m.el.querySelector('#eErr'); x.textContent = e.message; x.hidden = false; btn.disabled = false; }
    });
  }

  async function del(b) {
    let u = null;
    try { u = await BL.api('/barangays/' + b.id + '/usage'); } catch (e) { BL.toast(e.message); return; }
    if (u.active) {
      BL.confirmBox({ title: 'Cannot delete ' + b.name + ' yet', text: 'An evacuation is still running in this barangay. Finish it first in Live Evacuation.', ok: 'OK' });
      return;
    }
    const parts = [];
    const add = (n, one, many) => { if (n) parts.push(n + ' ' + (n === 1 ? one : many)); };
    add(u.residents, 'registered resident', 'registered residents');
    add(u.households, 'family', 'families');
    add(u.centers, 'evacuation center', 'evacuation centers');
    add(u.accounts, 'official account', 'official accounts');
    add(u.evacuations, 'evacuation record', 'evacuation records');
    BL.confirmBox({
      title: 'Are you sure you want to delete ' + b.name + '?',
      text: parts.length ? 'There are still ' + parts.join(', ') + ' linked to this barangay. Deleting it will also remove all of these from the system. This cannot be undone.'
        : 'This barangay will be removed from the list. This cannot be undone.',
      ok: 'Yes, Delete', danger: true,
      action: () => BL.api('/barangays/' + b.id + '/force', { method: 'DELETE' })
    }).then((ok) => { if (ok) { BL.toast(b.name + ' was deleted.'); load(); } });
  }

  $('add').addEventListener('click', () => {
    const m = BL.modal(
      '<div class="dialog-head"><h2>Add Barangay</h2>' + xBtn + '</div>' +
      '<div class="dialog-body" style="display:flex;flex-direction:column;gap:16px"><div id="aErr" class="form-error" hidden></div>' +
      '<div class="field-group"><label for="aName">Barangay name</label><input id="aName" class="input" placeholder="e.g. Barangay 201"></div></div>' +
      '<div class="dialog-foot"><span></span><div style="display:flex;gap:10px"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="button" class="btn btn-primary" id="aSave">Add</button></div></div>', 520);
    m.el.querySelector('#aSave').addEventListener('click', async () => {
      const name = m.el.querySelector('#aName').value.trim();
      try {
        if (!name) throw new Error('Enter the barangay name.');
        await BL.api('/barangays', { method: 'POST', json: { name } });
        m.close(); BL.toast('Barangay added.'); load();
      } catch (e) { const x = m.el.querySelector('#aErr'); x.textContent = e.message; x.hidden = false; }
    });
  });

  await load();
  BL.connectLive(() => load(), null);
})();
</script>
</body>
</html>
