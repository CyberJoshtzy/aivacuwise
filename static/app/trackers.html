<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trackers · Ai-Vacuwise</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="app.css?v=13">
<style>
.tlayout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; align-items: start; }
.people { list-style: none; margin: 0; padding: 0; max-height: 620px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.people button { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; background: #FFFFFF; font: inherit; cursor: pointer; }
.people button:hover, .people button[aria-pressed="true"] { border-color: var(--navy); background: var(--tint); }
.people .nm { font-size: 15px; font-weight: 800; color: var(--navy); }
.people .meta { font-size: 13px; color: var(--muted); }
.sig { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.map { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 14px; background: #F4F6FA; border: 1px solid var(--line); overflow: hidden; }
.map svg { width: 100%; height: 100%; display: block; }
.info { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 18px; }
.info .k { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.info .v { font-size: 15px; font-weight: 700; color: #1B2233; }
@media (max-width: 1100px) { .tlayout { grid-template-columns: minmax(0, 1fr); } .info { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
  <link rel="icon" type="image/png" href="/static/favicon.png?v=1">
</head>
<body>
<div class="shell">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Trackers</h1>
        <p>Find the last known location of evacuees with a tracker who are not yet at an evacuation center, such as missing seniors and PWD.</p>
      </div>
      <span class="live-badge" id="live"><span class="dot"></span><span class="txt">Connecting</span></span>
    </div>
    <div id="loadError" class="form-error" role="alert" hidden></div>

    <div class="tlayout">
      <section class="panel">
        <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><label for="q" class="sr-only">Search evacuees with a tracker</label><input id="q" class="input" type="search" placeholder="Search evacuee name or tracker ID" autocomplete="off"></div>
        <div style="font-size:13px;color:var(--muted)" id="countNote"></div>
        <ul class="people" id="people"></ul>
      </section>

      <div style="display:flex;flex-direction:column;gap:16px">
        <section class="panel">
          <div class="panel-head"><h2 id="mapTitle">Location map</h2>
          </div>
          <div class="map"><svg id="map" viewBox="0 0 1000 625" role="img" aria-label="Map of tracker locations"></svg></div>
        </section>
        <section class="panel" id="detail" hidden>
          <div class="panel-head"><h2 id="dName"></h2><a class="btn btn-ghost btn-sm" id="dMaps" target="_blank" rel="noopener">Open in Google Maps</a></div>
          <div class="info" id="dInfo"></div>
        </section>
      </div>
    </div>
  </main>
</div>
<script src="app.js?v=44"></script>
<script>
(async () => {
  const me = await BL.requireAuth();
  const $ = (id) => document.getElementById(id);
  let brgyNames = {};
  try { (await BL.api('/barangays') || []).forEach((b) => { brgyNames[b.id] = b.name; }); } catch (e) {}
  BL.renderSidebar(me, 'trackers.html', brgyNames[me.barangay_id]);

  let list = [], people = {}, details = {}, selected = null;
  const FRESH_MIN = 15;

  async function load() {
    try {
      const [ov, ev, det] = await Promise.all([BL.api('/trackers/overview'), BL.api('/evacuees'), BL.api('/evacuee_details').catch(() => [])]);
      list = ov || [];
      people = {}; (ev || []).forEach((e) => { people[e.id] = e; });
      details = {}; (det || []).forEach((d) => { details[d.id] = d; });
      $('loadError').hidden = true;
    } catch (e) { $('loadError').textContent = e.message; $('loadError').hidden = false; }
    renderList(); drawMap(); if (selected) showDetail(selected);
  }

  function prioTags(id) {
    const e = people[id] || {}, n = (details[id] || {}).special_needs || [], a = BL.age(e.birthdate), out = [];
    if (n.includes('Senior citizen') || (a !== null && a >= 60)) out.push('Senior');
    if (n.includes('PWD')) out.push('PWD');
    if (n.includes('Pregnant')) out.push('Pregnant');
    if (a !== null && a < 5) out.push('Child');
    return out;
  }
  const isPrio = (id) => prioTags(id).length > 0;
  const prioChips = (id) => prioTags(id).map((x) => ' <span class="chip">' + x + '</span>').join('');
  const minsAgo = (t) => t ? (Date.now() - BL.parseT(t).getTime()) / 60000 : Infinity;
  const sigColor = (t) => !t ? '#9AA3B5' : minsAgo(t) <= FRESH_MIN ? '#15803D' : '#B45309';

  function renderList() {
    const q = $('q').value.trim().toLowerCase();
    const rank = (t) => (t.center ? 2 : 0) + (isPrio(t.evacuee_id) ? 0 : 1);
    const shown = list.filter((t) => !q || (t.full_name + ' ' + t.device_id).toLowerCase().includes(q))
      .sort((a, b) => rank(a) - rank(b) || a.full_name.localeCompare(b.full_name));
    const missing = list.filter((t) => !t.center).length;
    $('countNote').textContent = missing + ' of ' + list.length + ' evacuee(s) with a tracker are not yet at an evacuation center. Seniors and PWD are listed first.';
    $('people').innerHTML = shown.length ? shown.map((t) =>
      '<li><button type="button" data-ev="' + t.evacuee_id + '" aria-pressed="' + (selected === t.evacuee_id) + '"><span class="sig" style="background:' + (t.center ? '#15803D' : '#B91C1C') + '"></span>' +
      '<span style="min-width:0"><span class="nm">' + BL.esc(t.full_name) + '</span> ' + (t.center ? '<span class="chip green">Accounted</span>' : '<span class="chip" style="background:#FDECEC;color:#B91C1C">Unaccounted</span>') + prioChips(t.evacuee_id) + '<br><span class="meta">Tracker ' + BL.esc(t.device_id) + ' &#183; ' + (t.timestamp ? 'last seen ' + BL.ago(t.timestamp) : 'no signal yet') + '</span></span></button></li>').join('')
      : '<li class="empty" style="display:block">' + (list.length ? 'No evacuee matches your search.' : 'No trackers are given to residents yet. Enter a tracker ID during Pre-Registration.') + '</li>';
  }

  // ---------- plain offline map: grid in meters, auto-scaled around the points ----------
  const W = 1000, H = 625, PAD = 70;
  function project(pts) {
    const lats = pts.map((p) => p.lat), lngs = pts.map((p) => p.lng);
    let minLat = Math.min(...lats), maxLat = Math.max(...lats), minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
    const midLat = (minLat + maxLat) / 2, kx = Math.cos(midLat * Math.PI / 180) * 111320, ky = 110540;
    let wm = (maxLng - minLng) * kx, hm = (maxLat - minLat) * ky;
    const span = Math.max(wm, hm * W / H, 200);           // at least 200 m wide
    const cx = (minLng + maxLng) / 2, cy = (minLat + maxLat) / 2;
    const mPerPx = span / (W - 2 * PAD);
    return { f: (lat, lng) => [W / 2 + (lng - cx) * kx / mPerPx, H / 2 - (lat - cy) * ky / mPerPx], mPerPx };
  }
  function niceStep(m) { const s = [50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000]; return s.find((x) => x >= m) || 50000; }
  function distM(a, b) {
    const R = 6371000, toR = Math.PI / 180, dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const fmtDist = (m) => m >= 1000 ? (m / 1000).toFixed(2) + ' km' : Math.round(m) + ' m';

  function drawMap() {
    const sel = list.find((t) => t.evacuee_id === selected);
    let pts = list.filter((t) => t.latitude != null).map((t) => ({ lat: t.latitude, lng: t.longitude, t }));
    if (sel && sel.latitude != null) pts = pts.filter((p) => p.t === sel || distM(p, { lat: sel.latitude, lng: sel.longitude }) < 3000);
    const all = pts;
    if (!all.length) {
      $('map').innerHTML = '<text x="500" y="312" text-anchor="middle" font-size="22" fill="#4A5368">' + (list.length ? 'No positions received yet from the trackers.' : 'No trackers yet.') + '</text>';
      return;
    }
    const pr = project(all);
    const step = niceStep(pr.mPerPx * 120), px = step / pr.mPerPx;
    let g = '';
    for (let x = W / 2 % px; x < W; x += px) g += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + H + '" stroke="#DCE1EA"/>';
    for (let y = H / 2 % px; y < H; y += px) g += '<line x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="#DCE1EA"/>';
    g += '<text x="' + (W - 12) + '" y="24" text-anchor="end" font-size="16" font-weight="700" fill="#4A5368">N &#8593;</text>';
    pts.forEach((p) => {
      const [x, y] = pr.f(p.lat, p.lng), on = p.t.evacuee_id === selected;
      g += '<g data-ev="' + p.t.evacuee_id + '" style="cursor:pointer">' +
        (on ? '<circle cx="' + x + '" cy="' + y + '" r="26" fill="none" stroke="#142C6E" stroke-width="4"><animate attributeName="r" values="18;30;18" dur="1.6s" repeatCount="indefinite"/></circle>' : '') +
        '<path d="M' + x + ' ' + y + 'c-10-14-16-22-16-30a16 16 0 0 1 32 0c0 8-6 16-16 30z" fill="' + (p.t.center ? '#15803D' : '#B91C1C') + '" stroke="#FFFFFF" stroke-width="2"/>' +
        '<circle cx="' + x + '" cy="' + (y - 30) + '" r="6" fill="#FFFFFF"/>' +
        '<text x="' + x + '" y="' + (y + 22) + '" text-anchor="middle" font-size="' + (on ? 18 : 15) + '" font-weight="800" fill="#142C6E">' + BL.esc(p.t.full_name.split(' ')[0]) + '</text></g>';
    });
    $('map').innerHTML = g;
  }

  function showDetail(evId) {
    const t = list.find((x) => x.evacuee_id === evId); if (!t) { $('detail').hidden = true; return; }
    const e = people[evId] || {}, d = details[evId] || {};
    const a = BL.age(e.birthdate);
    let fam = '-';
    if (e.household_id) { const head = Object.values(people).find((x) => x.household_id === e.household_id && x.is_head_of_family); fam = head ? 'Family of ' + head.full_name : 'Family #' + e.household_id; }
    const needs = (d.special_needs || []).filter((x) => x !== 'Medical condition').map((x) => x.replace('Medical: ', 'Medical: ')).join('; ') || 'None';
    const cell = (k, v) => '<div><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
    $('dName').textContent = t.full_name;
    $('dInfo').innerHTML =
      cell('Status', t.center ? '<span style="color:var(--green)">Accounted at ' + BL.esc(t.center) + '</span>' : '<span style="color:var(--red)">Unaccounted</span>') +
      cell('Last known location', t.latitude != null ? t.latitude.toFixed(6) + ', ' + t.longitude.toFixed(6) : 'No signal yet') +
      cell('Last signal', t.timestamp ? BL.dateTime(t.timestamp) + ' (' + BL.ago(t.timestamp) + ')' : '-') +
      cell('Tracker', BL.esc(t.device_id) + (t.battery != null ? ' &#183; battery ' + t.battery + '%' : '')) +
      cell('Age and sex', (a === null ? '-' : a + ' yrs') + ', ' + BL.esc(e.sex || '-')) +
      cell('Barangay', BL.esc(d.home_barangay || brgyNames[e.registered_barangay_id] || '-')) +
      cell('Family', BL.esc(fam)) +
      cell('Contact number', BL.esc(e.contact_number || 'None')) +
      cell('Special needs', BL.esc(needs));
    $('dMaps').hidden = t.latitude == null;
    if (t.latitude != null) $('dMaps').href = 'https://www.google.com/maps?q=' + t.latitude + ',' + t.longitude;
    $('mapTitle').textContent = 'Location of ' + t.full_name;
    $('detail').hidden = false;
  }

  function pick(evId) {
    if (selected === evId) { selected = null; $('detail').hidden = true; $('mapTitle').textContent = 'Location map'; renderList(); drawMap(); return; }
    selected = evId; renderList(); drawMap(); showDetail(evId);
  }
  $('people').addEventListener('click', (e) => { const b = e.target.closest('[data-ev]'); if (b) pick(Number(b.dataset.ev)); });
  $('map').addEventListener('click', (e) => { const g = e.target.closest('[data-ev]'); if (g) pick(Number(g.dataset.ev)); });
  $('q').addEventListener('input', renderList);
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const b = $('people').querySelector('[data-ev]'); if (b) pick(Number(b.dataset.ev)); } });
  await load();
  setInterval(() => { renderList(); if (selected) showDetail(selected); }, 30000); // refresh "x min ago"
  BL.connectLive((m) => { if (!m || m.type === 'gps_update' || m.type === 'records_update' || m.type === 'occupancy_update' || m.type === 'sync_update') load(); }, $('live'));
})();
</script>
</body>
</html>
