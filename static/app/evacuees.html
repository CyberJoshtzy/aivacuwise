<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resident List · Ai-Vacuwise</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="app.css?v=57">
<style>
.bpick { display: flex; flex-direction: column; gap: 12px; }
.bpick .bsearch { max-width: 360px; }
.bopt { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px; border: none; border-bottom: 1px solid #EEF1F6; background: #FFFFFF; font: inherit; text-align: left; cursor: pointer; }
.bopt:hover { background: #EEF2FF; }
.bopt strong { color: var(--navy); }
.bopt span { font-size: 15px; color: var(--muted); }
.bcard { text-align: left; font: inherit; cursor: pointer; padding: 12px 14px; border-radius: 12px; border: 2px solid #E3E8F2; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, box-shadow .15s; }
.bcard:hover { border-color: var(--orange); box-shadow: 0 6px 16px rgba(11,31,77,.08); }
.bcard[aria-pressed="true"] { border-color: var(--navy); background: #EEF2FF; }
.bcard strong { color: var(--navy); font-size: 15px; }
.bcard span { font-size: 15px; color: var(--muted); }
.bcard .bad { color: #B91C1C; font-weight: 700; }
.filters-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; width: 100%; }

.bwrap { position: relative; }
.bwrap .search { width: 100%; max-width: none; }
.bgrid { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 50; display: flex; flex-direction: column; max-height: 300px; overflow-y: auto; border: 1px solid #E3E8F2; border-radius: 10px; background: #FFFFFF; box-shadow: 0 10px 24px rgba(11,31,77,.12); }
.bgrid[hidden] { display: none; }
.bnote { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
.bnote strong { color: var(--navy); }
.toolbar { flex-direction: column; align-items: stretch; }
.fam { display: flex; flex-direction: column; gap: 8px; }
.fam .m { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg); cursor: pointer; border: none; font: inherit; text-align: left; width: 100%; }
.fam .m:hover { background: #EEF2FF; }
.fam .m strong { color: var(--navy); }
.fam .m small { color: var(--muted); font-size: 15px; display: block; }
/* search boxes side by side */
.filters-row { display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; align-items: center !important; gap: 12px !important; }
.filters-row > .bwrap { flex: 0 0 300px !important; width: 300px !important; max-width: none !important; margin: 0 !important; }
.filters-row > .search { flex: 0 0 320px !important; width: 320px !important; max-width: none !important; margin: 0 !important; }
.filters-row .search .input { width: 100% !important; }
@media (max-width: 700px) { .filters-row { flex-wrap: wrap !important; } .filters-row > .bwrap, .filters-row > .search { flex: 1 1 100% !important; width: 100% !important; } }
/* evacuee table layout */
table.data td { vertical-align: middle; padding-top: 12px; padding-bottom: 12px; }
table.data .nm { font-weight: 800; color: var(--navy); font-size: 15px; line-height: 1.3; }
table.data .fm { font-weight: 600; color: #1F2937; font-size: 15px; line-height: 1.3; }
table.data .sub { font-size: 15px; color: var(--muted); margin-top: 2px; }
table.data .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
table.data .tg { font-size: 15px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #FFF4E5; color: #B45309; white-space: nowrap; }
table.data .st { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
table.data .st i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
table.data .st.in { color: #15803D; } table.data .st.in i { background: #15803D; }
table.data .st.out { color: var(--muted); } table.data .st.out i { background: #C2CAD8; }
table.data .row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: nowrap; }
table.data .row-actions .btn { min-height: 36px; padding: 0 12px; font-size: 15px; }
table.data tbody tr:hover td { background: #F6F8FD; }
</style>
  <link rel="icon" type="image/png" href="/static/favicon.png?v=2">
</head>
<body>
<div class="shell">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Resident List</h1>
        <p id="count">Loading residents.</p>
      </div>
      <span class="live-badge" id="live" style="display:none"><span class="dot"></span><span class="txt">Connecting</span></span>
    </div>

    <div class="toolbar">
      <div class="filters-row">
      <div class="bwrap" id="bpick" hidden>
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <input id="bq" class="input" type="search" placeholder="Search barangay, e.g. 200" aria-label="Search barangay" autocomplete="off">
        </div>
              </div>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <label for="q" class="sr-only">Search evacuees</label>
        <input id="q" class="input" type="search" placeholder="Search by name or address">
      </div>
      </div>
      <div class="pills" role="group" aria-label="Filter evacuees" id="pills"></div>
    </div>

    <div id="loadError" class="form-error" role="alert" hidden></div>

    <section class="panel" style="padding:0;overflow:hidden">
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th scope="col">Evacuee</th><th scope="col" id="brgyCol" hidden>Barangay</th><th scope="col">Family</th><th scope="col">Status</th><th scope="col" style="text-align:right">Actions</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" style="margin:16px" hidden></div>
    </section>
  </main>
</div>
<script src="app.js?v=56"></script>
<script>
(async () => {
  const me = await BL.requireAuth();
  const city = me.role === 'city_admin';
  const $ = (id) => document.getElementById(id);
  let brgyNames = {}, centerNames = {}, where = {}, list = [], listAll = [], extra = {}, trackerOf = {};
  let filter = 'all';
  let pickedBrgy = null;
  const hasMed = (e) => ((extra[e.id] || {}).special_needs || []).some((x) => x === 'Medical condition' || x.startsWith('Medical: '));
  const surname = (n) => String(n || '').trim().split(/\s+/).pop().toLowerCase();

  try {
    const [brgys, centers] = await Promise.all([BL.api('/barangays'), BL.api('/evacuation_centers')]);
    (brgys || []).forEach((b) => { brgyNames[b.id] = b.name; });
    (centers || []).forEach((c) => { centerNames[c.id] = c.name; });
  } catch (e) { /* names fall back to ids */ }
  BL.renderSidebar(me, 'evacuees.html', brgyNames[me.barangay_id]);
  const tbar = BL.timeBar(document.querySelector('.page-head'), { me });
  let since = {};
  $('brgyCol').hidden = !city;

  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function niceDate(d) {
    const m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? MONTHS[Number(m[2]) - 1] + ' ' + Number(m[3]) + ', ' + m[1] : '-';
  }
  function ageText(d) {
    const a = BL.age(d); if (a === null) return '-';
    if (a >= 1) return a + (a === 1 ? ' year old' : ' years old');
    const b = new Date(String(d).slice(0, 10)), t = new Date();
    const mo = Math.max(0, (t.getFullYear() - b.getFullYear()) * 12 + t.getMonth() - b.getMonth() - (t.getDate() < b.getDate() ? 1 : 0));
    return mo + (mo === 1 ? ' month old' : ' months old');
  }
  function needsList(ev) {
    const n = (extra[ev.id] || {}).special_needs || [];
    const meds = n.filter((x) => x.startsWith('Medical: ')).map((x) => x.slice(9));
    const out = n.filter((x) => x !== 'Medical condition' && !x.startsWith('Medical: '));
    if (n.includes('Medical condition') || meds.length) out.push('Medical condition' + (meds.length ? ': ' + meds.join(', ') : ''));
    return out;
  }
  const allList = () => listAll;
  function familyText(ev) {
    if (!ev.household_id) return 'None';
    const head = listAll.find((x) => x.household_id === ev.household_id && x.is_head_of_family);
    const name = head ? 'Family of ' + head.full_name : 'Family #' + ev.household_id;
    return name + (ev.is_head_of_family ? ' (head of the family)' : '');
  }
  const homeBrgy = (ev) => (extra[ev.id] || {}).home_barangay || brgyNames[ev.registered_barangay_id] || '-';
  const FILTERS = [
    ['all', 'All', () => true],
    ['in', 'Accounted', (e) => !!where[e.id]],
    ['out', 'Unaccounted', (e) => !where[e.id]],
    ['kids', 'Children', (e) => { const a = BL.age(e.birthdate); return a !== null && a < 18; }],
    ['seniors', 'Seniors', (e) => { const a = BL.age(e.birthdate); return a !== null && a >= 60; }],
    ['pwd', 'PWD', (e) => ((extra[e.id] || {}).special_needs || []).includes('PWD')],
    ['preg', 'Pregnant', (e) => ((extra[e.id] || {}).special_needs || []).includes('Pregnant')],
    ['med', 'Medical condition', hasMed]
  ];
  $('pills').innerHTML = FILTERS.map(([k, label]) => '<button type="button" class="pill" data-f="' + k + '" aria-pressed="' + (k === filter) + '">' + label + '</button>').join('');
  $('pills').addEventListener('click', (e) => {
    const b = e.target.closest('.pill'); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('.pill').forEach((p) => p.setAttribute('aria-pressed', p.dataset.f === filter));
    render();
  });
  $('q').addEventListener('input', render);

  async function load() {
    try {
      const [evacuees, summary, det] = await Promise.all([BL.api('/evacuees'), BL.api('/dashboard/summary'), BL.api('/evacuee_details').catch(() => [])]);
      extra = {}; (det || []).forEach((d) => { extra[d.id] = d; });
      try { trackerOf = {}; (await BL.api('/trackers') || []).forEach((t) => { if (t.assigned_evacuee_id) trackerOf[t.assigned_evacuee_id] = t.device_id; }); } catch (e) {}
      where = {}; since = {};
      tbar.refresh();
      (summary.barangays || []).forEach((b) => (b.centers || []).forEach((c) => (c.evacuees || []).forEach((ev) => { where[ev.id] = c.name; since[ev.id] = ev.since; })));
      if (!city) {  // residents checked in at another barangay's center are accounted for
        try { ((await BL.api('/cross/status')) || {}).away.forEach((x) => { where[x.evacuee_id] = x.center_name + (x.center_barangay ? ' (' + x.center_barangay + ')' : ''); since[x.evacuee_id] = x.checked_in_at; }); } catch (e) {}
      }
      listAll = evacuees || [];
      list = listAll.filter((e) => city || e.registered_barangay_id === me.barangay_id);
      $('loadError').hidden = true;
      render();
    } catch (e) {
      $('loadError').textContent = e.message;
      $('loadError').hidden = false;
    }
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const test = FILTERS.find((f) => f[0] === filter)[2];
    renderBrgys();
    const bq = $('bq').value.trim().toLowerCase();
    const base = !bq ? list : list.filter((e) => (String(brgyNames[e.registered_barangay_id] || '') + ' ' + String(homeBrgy(e))).toLowerCase().includes(bq));
    const shown = base.filter((e) => test(e) && (!q || (String(e.full_name) + ' ' + String(e.address || '')).toLowerCase().includes(q)))
      .sort((a, b) => String(a.full_name).localeCompare(String(b.full_name)));
    const inCount = list.filter((e) => where[e.id]).length;
    $('count').textContent = list.length + (list.length === 1 ? ' resident is' : ' residents are') + ' registered' + (city ? ' across all barangays' : ' in ' + (brgyNames[me.barangay_id] || 'your barangay')) + '. ' + inCount + ' are at an evacuation center now.';
    if (bq) $('count').textContent = base.length + (base.length === 1 ? ' resident matches' : ' residents match') + ' barangay "' + $('bq').value.trim() + '". ' + base.filter((e) => where[e.id]).length + ' are at an evacuation center now.';
    FILTERS.forEach(([k, label, t]) => { const b = document.querySelector('.pill[data-f="' + k + '"]'); if (b) b.textContent = label + ' (' + base.filter(t).length + ')'; });
    $('rows').innerHTML = shown.map((e) => {
      const a = BL.age(e.birthdate);
      const face = '';
      const status = where[e.id] ? '<span class="st in" title="' + BL.esc(where[e.id]) + '"><i></i>' + BL.esc(where[e.id]) + '</span>' + (since[e.id] ? '<span class="since">since ' + BL.when(since[e.id]) + '</span>' : '') : '<span class="st out"><i></i>Not checked in</span>';
      const head = e.household_id ? listAll.find((x) => x.household_id === e.household_id && x.is_head_of_family) : null;
      const hh = e.household_id ? '<div class="fm">' + BL.esc(head ? head.full_name : 'Family #' + e.household_id) + '</div><div class="sub">' + (e.is_head_of_family ? 'Head of family' : 'Member') + '</div>' : '<span style="color:var(--muted)">None</span>';
      return '<tr>' +
        '<td><div class="nm">' + BL.esc(e.full_name) + '</div>' +
        '<div class="sub">' + BL.esc(e.sex || 'Sex not set') + ' &middot; ' + (a === null ? 'age unknown' : (a >= 1 ? a + ' yrs' : ageText(e.birthdate))) + '</div>' +
        (needsList(e).length ? '<div class="tags">' + needsList(e).map((n) => '<span class="tg">' + BL.esc(n) + '</span>').join('') + '</div>' : '') + '</td>' +
        (city ? '<td>' + BL.esc(homeBrgy(e)) + '</td>' : '') +
        '<td>' + hh + '</td><td>' + status + '</td>' +
        '<td><div class="row-actions">' +
        '<button type="button" class="btn btn-ghost btn-sm" data-act="view" data-id="' + e.id + '" aria-label="View ' + BL.esc(e.full_name) + '">View</button>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-act="edit" data-id="' + e.id + '" aria-label="Edit ' + BL.esc(e.full_name) + '">Edit</button>' +
        '<button type="button" class="btn btn-del btn-sm" data-act="del" data-id="' + e.id + '" aria-label="Delete ' + BL.esc(e.full_name) + '">Delete</button>' +
        '</div></td></tr>';
    }).join('');
    $('empty').hidden = shown.length > 0;
    $('empty').textContent = list.length ? 'No evacuees match your search or filter.' : 'No residents are registered yet. Households registered at the kiosk will appear here.';
  }

  function renderBrgys() {
    if (city) $('bpick').hidden = false;
  }
  $('bq').addEventListener('input', render);

  $('rows').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const ev = list.find((x) => x.id === Number(b.dataset.id)); if (!ev) return;
    if (b.dataset.act === 'view') view(ev);
    if (b.dataset.act === 'edit') edit(ev);
    if (b.dataset.act === 'del') del(ev);
  });

  const xBtn = '<button type="button" class="x-btn" data-close aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A5368" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>';

  async function view(ev) {
    const a = BL.age(ev.birthdate);
    const m = BL.modal(
      '<div class="dialog-head"><div><h2>' + BL.esc(ev.full_name) + '</h2><div style="font-size:15px;color:var(--muted)">' + (where[ev.id] ? 'At ' + BL.esc(where[ev.id]) + (since[ev.id] ? ' since ' + BL.when(since[ev.id]) : ' now') : 'Not at an evacuation center') + '</div></div>' + xBtn + '</div>' +
      '<div class="dialog-body" style="display:flex;flex-direction:column;gap:18px">' +
      '<div style="display:flex;gap:16px;align-items:center"><div id="vPhoto" style="width:96px;height:96px;border-radius:50%;background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);text-align:center;flex-shrink:0">No photo</div><div style="font-size:15px;color:var(--muted)">Photo shown on the Entrance Display. Registrations made before photos were saved show initials instead.</div></div>' +
      '<div class="facts">' +
      '<div><div class="k">Sex</div><div class="v">' + BL.esc(ev.sex || '-') + '</div></div>' +
      '<div><div class="k">Birthday</div><div class="v">' + BL.esc(niceDate(ev.birthdate)) + '</div></div>' +
      '<div><div class="k">Age</div><div class="v">' + BL.esc(ageText(ev.birthdate)) + '</div></div>' +
      '<div><div class="k">Address</div><div class="v">' + BL.esc(ev.address || '-') + '</div></div>' +
      '<div><div class="k">Contact number</div><div class="v">' + BL.esc(ev.contact_number || 'None') + '</div></div>' +
      '<div><div class="k">Identification</div><div class="v">' + (ev.identification_method === 'facial_recognition' ? 'Face ID' : 'Manual') + '</div></div>' +
      '<div><div class="k">Barangay</div><div class="v">' + BL.esc(homeBrgy(ev)) + '</div></div>' +
      '<div><div class="k">Family</div><div class="v">' + BL.esc(familyText(ev)) + '</div></div>' +
      ((extra[ev.id] || {}).guardian_evacuee_id ? '<div><div class="k">Parent or guardian</div><div class="v">' + BL.esc((listAll.find((x) => x.id === extra[ev.id].guardian_evacuee_id) || {}).full_name || '-') + '</div></div>' : '') +
      '<div><div class="k">Civil status</div><div class="v">' + BL.esc((extra[ev.id] || {}).civil_status || '-') + '</div></div>' +
      '<div><div class="k">Special needs</div><div class="v">' + BL.esc(needsList(ev).join('; ') || 'None') + '</div></div>' +
      '</div>' +
      familyBlock(ev) +
      '<div><h3 style="font-size:16px;font-weight:800;margin-bottom:8px">Movement history</h3><ul class="timeline" id="hist"><li style="color:var(--muted)">Loading history.</li></ul></div>' +
      '</div>' +
      '<div class="dialog-foot"><span style="font-size:15px;color:var(--muted)">Every check-in and check-out, newest first.</span><div style="display:flex;gap:10px"><button type="button" class="btn btn-ghost" data-close>Close</button><button type="button" class="btn btn-primary" id="toEdit">Edit Information</button></div></div>', 820);
    m.el.querySelector('#toEdit').addEventListener('click', () => { m.close(); edit(ev); });
    m.el.querySelectorAll('[data-fam]').forEach((b) => b.addEventListener('click', () => { const o = listAll.find((x) => x.id === Number(b.dataset.fam)); if (o) { m.close(); view(o); } }));
    fetch('/evacuees/' + ev.id + '/photo', { headers: { Authorization: 'Bearer ' + BL.token() } }).then((r) => r.ok ? r.blob() : null).then((b) => { if (b) m.el.querySelector('#vPhoto').innerHTML = '<img alt="Photo of ' + BL.esc(ev.full_name) + '" src="' + URL.createObjectURL(b) + '" style="width:100%;height:100%;object-fit:cover">'; }).catch(() => {});
    try {
      const hist = await BL.api('/evacuees/' + ev.id + '/history');
      const labels = { check_in: ['Checked in at', '#15803D'], check_out: ['Left', '#1D4ED8'] };
      m.el.querySelector('#hist').innerHTML = (hist || []).length ? hist.map((h) => {
        const l = labels[h.event_type] || [h.event_type, '#4A5368'];
        return '<li><span class="dot" style="background:' + l[1] + '"></span><span style="flex-grow:1"><strong>' + l[0] + '</strong> ' + BL.esc(centerNames[h.evacuation_center_id] || 'center #' + h.evacuation_center_id) + '</span><span style="color:var(--muted);white-space:nowrap">' + (h.timestamp ? BL.when(h.timestamp) : '') + '</span></li>';
      }).join('') : '<li class="empty" style="display:block;width:100%">No check-ins yet. This evacuee has not been to an evacuation center.</li>';
    } catch (e) {
      m.el.querySelector('#hist').innerHTML = '<li class="form-error" style="display:block;width:100%">' + BL.esc(e.message) + '</li>';
    }
  }

  function familyBlock(ev) {
    const sn = surname(ev.full_name);
    const house = ev.household_id ? listAll.filter((x) => x.id !== ev.id && x.household_id === ev.household_id) : [];
    const same = listAll.filter((x) => x.id !== ev.id && !house.includes(x) && x.registered_barangay_id === ev.registered_barangay_id && surname(x.full_name) === sn);
    const row = (x, tag) => {
      const a = BL.age(x.birthdate);
      return '<button type="button" class="m" data-fam="' + x.id + '"><span><strong>' + BL.esc(x.full_name) + '</strong>' + (x.is_head_of_family ? ' <span class="chip navy">Head</span>' : '') +
        '<small>' + BL.esc(x.sex || '-') + ', ' + (a === null ? 'age unknown' : a + ' yrs') + (needsList(x).length ? ' &middot; ' + BL.esc(needsList(x).join(', ')) : '') + ' &middot; ' + tag + '</small></span>' +
        (where[x.id] ? '<span class="chip green">At ' + BL.esc(where[x.id]) + '</span>' : '<span class="chip" style="background:#FDECEC;color:#B91C1C">Not checked in</span>') + '</button>';
    };
    const body = house.map((x) => row(x, 'Same family')).join('') + same.map((x) => row(x, 'Same surname, ' + BL.esc(homeBrgy(x)))).join('');
    return '<div><h3 style="font-size:16px;font-weight:800;margin-bottom:8px">Family members (' + (house.length + same.length) + ')</h3><div class="fam">' +
      (body || '<p class="empty" style="margin:0">No other family members or residents with the surname "' + BL.esc(ev.full_name.trim().split(/\s+/).pop()) + '" in this barangay.</p>') +
      '</div><p style="font-size:15px;color:var(--muted);margin:6px 0 0">Click a name to open that person.</p></div>';
  }

  function edit(ev) {
    const ex = extra[ev.id] || {};
    const sexes = ['Male', 'Female'];
    if (ev.sex && !sexes.includes(ev.sex)) sexes.unshift(ev.sex);
    const m = BL.modal(
      '<form id="ef" novalidate style="display:contents">' +
      '<div class="dialog-head"><h2>Edit evacuee information</h2>' + xBtn + '</div>' +
      '<div class="dialog-body"><div class="form-error" id="eErr" role="alert" hidden style="margin-bottom:14px"></div><div class="form-grid">' +
      '<div class="field-group span4"><label for="fName">Full name *</label><input id="fName" class="input" value="' + BL.esc(ev.full_name) + '" required></div>' +
      '<div class="field-group"><label for="fSex">Sex *</label><select id="fSex" class="input">' + sexes.map((s) => '<option' + (s === ev.sex ? ' selected' : '') + '>' + BL.esc(s) + '</option>').join('') + '</select></div>' +
      '<div class="field-group"><label for="fBday">Birthday *</label><input id="fBday" type="date" class="input" value="' + BL.esc(String(ev.birthdate || '').slice(0, 10)) + '"></div>' +
      '<div class="field-group span2"><label for="fAge">Age</label><input id="fAge" class="input" readonly style="background:var(--bg)"></div>' +
      '<div class="field-group span4"><label for="fAddr">Address *</label><input id="fAddr" class="input" value="' + BL.esc(ev.address || '') + '"></div>' +
      '<div class="field-group span2"><label for="fPhone">Contact number</label><input id="fPhone" type="tel" class="input" value="' + BL.esc(ev.contact_number || '') + '"></div>' +
      '<div class="field-group span2"><label for="fCivil">Civil status</label><select id="fCivil" class="input">' + ['', 'Single', 'Married', 'Widowed', 'Separated'].map((c) => '<option value="' + c + '"' + (c === (ex.civil_status || '') ? ' selected' : '') + '>' + (c || 'Not set') + '</option>').join('') + '</select></div>' +
      '<div class="field-group span4"><label for="fTrk">GPS tracker ID</label><input id="fTrk" class="input" placeholder="Leave empty if no tracker" value="' + BL.esc(trackerOf[ev.id] || '') + '"></div>' +
      '<div class="field-group span4"><label for="fBrgy">Barangay</label><input id="fBrgy" class="input" value="' + BL.esc(homeBrgy(ev) === '-' ? '' : homeBrgy(ev)) + '"></div>' +
      '<div class="field-group span4"><span style="font-size:15px;font-weight:700">Special needs</span><div style="display:flex;flex-wrap:wrap;gap:8px" id="fNeeds">' + ['Senior citizen', 'Pregnant', 'PWD', 'Medical condition'].map((n) => '<label class="check" style="border:1.5px solid var(--field);border-radius:10px;padding:0 12px"><input type="checkbox" value="' + n + '"' + ((ex.special_needs || []).includes(n) ? ' checked' : '') + '>' + n + '</label>').join('') + '</div></div>' +
      '</div></div>' +
      '<div class="dialog-foot"><span style="font-size:15px;color:var(--muted)" id="eHint"></span><div style="display:flex;gap:10px"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="submit" class="btn btn-primary" id="eSave">Save Changes</button></div></div>' +
      '</form>', 720);
    const f = (id) => m.el.querySelector('#' + id);
    const sync = () => {
      const a = BL.age(f('fBday').value);
      f('fAge').value = a === null ? '' : a + ' years old';
      const miss = [];
      if (!f('fName').value.trim()) miss.push('full name');
      if (!f('fBday').value) miss.push('birthday');
      if (!f('fAddr').value.trim()) miss.push('address');
      f('eSave').disabled = miss.length > 0;
      f('eHint').textContent = miss.length ? 'Required: ' + miss.join(', ') + '.' : 'All required fields are filled in.';
    };
    ['fName', 'fBday', 'fAddr'].forEach((id) => f(id).addEventListener('input', sync));
    sync();
    f('ef').addEventListener('submit', async (e) => {
      e.preventDefault();
      f('eSave').disabled = true;
      try {
        await BL.api('/evacuees/' + ev.id, { method: 'PUT', json: {
          full_name: f('fName').value, sex: f('fSex').value, birthdate: f('fBday').value,
          address: f('fAddr').value, contact_number: f('fPhone').value,
          civil_status: f('fCivil').value || null, home_barangay: f('fBrgy').value.trim() || null,
          special_needs: (() => {
            const picked = Array.from(m.el.querySelectorAll('#fNeeds input:checked')).map((i) => i.value);
            const meds = picked.includes('Medical condition') ? (ex.special_needs || []).filter((x) => x.startsWith('Medical: ')) : [];
            return picked.concat(meds);
          })()
        } });
        if (f('fTrk').value.trim() !== (trackerOf[ev.id] || '')) await BL.api('/evacuees/' + ev.id + '/tracker', { method: 'PUT', json: { device_id: f('fTrk').value.trim() } });
        m.close();
        BL.toast('Evacuee information updated.');
        load();
      } catch (ex) {
        f('eErr').textContent = ex.message; f('eErr').hidden = false; f('eSave').disabled = false;
      }
    });
  }

  function del(ev) {
    BL.confirmBox({
      title: 'Delete ' + ev.full_name + '?',
      text: 'This removes the evacuee\'s information, saved face data, and check-in history. The camera at evacuation centers will no longer recognize this person. This cannot be undone.',
      ok: 'Delete Evacuee', danger: true,
      action: () => BL.api('/evacuees/' + ev.id, { method: 'DELETE' })
    }).then((done) => { if (done) { BL.toast(ev.full_name + ' was deleted.'); load(); } });
  }

  await load();
  BL.connectLive(() => load(), $('live'));
})();
</script>
</body>
</html>
