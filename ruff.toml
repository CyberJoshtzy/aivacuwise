# Ruff settings for Ai-Vacuwise (linting, security checks, formatting)
target-version = "py313"
line-length = 100

extend-exclude = [
    "venv",
    "static",
    "alembic/versions",
    "scripts/archive",
    # old one-off patch scripts, until they are moved to scripts/archive
    "patch_*.py",
    "fix_*.py",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: unused imports, undefined names
    "W",   # warnings
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "S",   # bandit: security checks
    "UP",  # modern Python syntax
]
ignore = [
    "E501",  # long lines are handled by the formatter
    "B008",  # FastAPI uses Depends() in default arguments by design
    "UP031", # old % string formatting: style only, clean up after the defense
    "E402",  # imports mid-file from appended patch blocks: removed by the router refactor
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # assert and test passwords are fine in tests
"conftest.py" = ["S101", "S105", "S106"]
