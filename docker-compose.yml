# Fixed project name so the database volumes (bilislikas20_postgres_data,
# bilislikas20_redis_data) are kept even though the folder is now ~/ai-vacuwise.
name: bilislikas20

services:
  postgres:
    image: postgres:16
    container_name: bilislikas_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bilislikas_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
